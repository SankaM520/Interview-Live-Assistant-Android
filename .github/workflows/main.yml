name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o "Interview-Live-Assistant-Android-X300Pro-v8-BRACE-FIXED.zip"

      - name: Build APK
        working-directory: InterviewAssistantAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interview-assistant-apk
          path: InterviewAssistantAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
