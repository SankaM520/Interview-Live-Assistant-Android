<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Live Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1220;color:#e8eef9}
.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:21px;margin:0}.status{font-size:13px;color:#9fb1cc}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}
.card{background:#121c2d;border:1px solid #263650;border-radius:14px;padding:15px}
label{display:block;font-size:12px;color:#9fb1cc;margin:0 0 6px}input,textarea{width:100%;background:#0b1424;border:1px solid #2b3c59;color:#eef4ff;border-radius:9px;padding:10px;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer;background:#243653;color:#fff}
button.primary{background:#2563eb}button.danger{background:#a83232}button:disabled{opacity:.45;cursor:not-allowed}
h2{font-size:14px;margin:0 0 8px}.panel{min-height:190px;background:#09111e;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.55}
#answer{min-height:230px}.small{font-size:11px;color:#8192ad;margin-top:7px}.ok{color:#67d89a}.bad{color:#ff8d8d}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Interview Live Assistant</h1><div id="status" class="status">Ready</div></div>
  <div class="grid">
    <aside class="card">
      <label>Company</label><input id="company" placeholder="Company name">
      <label>Position</label><input id="position" placeholder="Accounting / Finance role">
      <label>OpenAI API Key</label><input id="key" type="password" placeholder="sk-...">
      <label>CV / Profile text (optional)</label><textarea id="cv" placeholder="Paste your CV text here"></textarea>
      <label>Job details (optional)</label><textarea id="jd" placeholder="Paste the job description here"></textarea>
      <div class="buttons">
        <button id="start" class="primary">START LISTENING</button>
        <button id="answer">GET ANSWER</button>
        <button id="stop" class="danger">STOP</button>
        <button id="clear">CLEAR</button>
      </div>
      <div class="small">Use speakerphone for a normal cellular call. Keep this page open while listening.</div>
    </aside>
    <main class="card">
      <h2>LIVE TRANSCRIPT</h2>
      <div id="transcript" class="panel">No transcript yet.</div>
      <div class="small">Realtime microphone transcription</div>
      <br>
      <h2>ANSWER</h2>
      <div id="answerBox" class="panel">No answer yet.</div>
    </main>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
